{% extends "base.html" %}
{% block title %}无访问权限 - 物料领取看板{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 60vh;">
    <div class="card shadow-sm border-0" style="max-width: 520px;">
        <div class="card-body text-center p-5">
            <div class="mb-3">
                <i class="fas fa-lock text-danger" style="font-size: 3rem;"></i>
            </div>
            <h4 class="mb-3">无访问权限</h4>
            <p class="text-muted mb-2">
                当前角色「{{ role_label }}」权限不足，无法访问
                {% if page_name %}<span class="fw-semibold">{{ page_name }}</span>{% else %}该页面{% endif %}。
            </p>
            <p class="text-muted small mb-4">
                如需开通，请联系系统管理员在「系统管理 → 角色权限」中调整。
            </p>
            <a href="/kanban" class="btn btn-primary">
                <i class="fas fa-columns me-1"></i>返回看板
            </a>
        </div>
    </div>
</div>
{% endblock %}
