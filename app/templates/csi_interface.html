{% extends "base.html" %}
{% block title %}同步接口查询 - 物料领取看板{% endblock %}
{% block content %}
<style>
/* 操作列固定右侧：20 列横向滚动时图标按钮始终可见 */
.csi-action-col {
    position: sticky;
    right: 0;
    background: #fff;
    z-index: 2;
    box-shadow: -4px 0 6px -4px rgba(0, 0, 0, .15);
    width: 76px;
    min-width: 76px;
    max-width: 76px;
    white-space: nowrap;
    padding-left: 4px !important;
    padding-right: 4px !important;
}
thead .csi-action-col { z-index: 3; background: #f8f9fa; }
.table-hover > tbody > tr:hover > .csi-action-col { background: #ececec; }
/* 操作按钮纯图标：固定方块尺寸，悬停显示 title */
.csi-action-col .btn { width: 30px; height: 26px; line-height: 1; }
</style>
<div class="card shadow-sm">
    <div class="card-header bg-white py-3">
        <h5 class="mb-0"><i class="fas fa-sync-alt me-2 text-info"></i><span data-i18n="csi.title">同步接口查询</span></h5>
    </div>
    <div class="card-body">
        <div class="row g-2 mb-3">
            <div class="col-6 col-md-2">
                <select class="form-select form-select-sm" id="fSite">
                    {% if session.user.role == 'admin' %}
                    <option value="" data-i18n="csi.all_sites">全部站点</option>
                    {% for site in session.user.available_sites %}
                    <option value="{{ site }}" {% if site|string == session.user.siteref|string %}selected{% endif %}>{{ site_config.get(site, site) }}</option>
                    {% endfor %}
                    {% else %}
                    <option value="{{ session.user.siteref }}">{{ site_config.get(session.user.siteref, session.user.siteref) }}</option>
                    {% endif %}
                </select>
            </div>
            <div class="col-6 col-md-2">
                <select class="form-select form-select-sm" id="fSync">
                    <option value="" data-i18n="csi.all_sync">全部同步状态</option>
                    <option value="0" data-i18n="csi.sync_pending">待同步</option>
                    <option value="1" data-i18n="csi.sync_success">成功</option>
                    <option value="2" data-i18n="csi.sync_failed">人工失败</option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <select class="form-select form-select-sm" id="fStatus">
                    <option value="" data-i18n="csi.all_status">全部状态</option>
                    <option value="PENDING">PENDING</option>
                    <option value="QUEUED">QUEUED</option>
                    <option value="SUBMITTING">SUBMITTING</option>
                    <option value="SUCCESS">SUCCESS</option>
                    <option value="REVERSED" data-i18n="csi.status_reversed">REVERSED</option>
                    <option value="CANCELLED" data-i18n="csi.status_cancelled">CANCELLED</option>
                    <option value="FAILED_MANUAL">FAILED_MANUAL</option>
                </select>
            </div>
            <div class="col-6 col-md-3">
                <input type="text" class="form-control form-control-sm" id="fItem" data-i18n="csi.item" placeholder="物料号">
            </div>
            <div class="col-6 col-md-3">
                <input type="text" class="form-control form-control-sm" id="fLot" data-i18n="csi.lot" placeholder="批次">
            </div>
        </div>
        <div class="row g-2 mb-3">
            <div class="col-6 col-md-2">
                <input type="date" class="form-control form-control-sm" id="fDateFrom" title="开始日期">
            </div>
            <div class="col-6 col-md-2">
                <input type="date" class="form-control form-control-sm" id="fDateTo" title="结束日期">
            </div>
            <div class="col-6 col-md-4">
                <input type="text" class="form-control form-control-sm" id="fKeyword" data-i18n="csi.keyword" placeholder="traceId / 错误信息 / 创建人">
            </div>
            <div class="col-6 col-md-2">
                <button class="btn btn-primary btn-sm w-100" onclick="search()"><i class="fas fa-search me-1"></i><span data-i18n="csi.query">查询</span></button>
            </div>
            <div class="col-6 col-md-2">
                <button class="btn btn-outline-secondary btn-sm w-100" onclick="resetFilters()"><i class="fas fa-redo me-1"></i><span data-i18n="csi.reset">重置</span></button>
            </div>
        </div>
        <div class="row g-2 mb-3">
            <div class="col-12 d-flex justify-content-between align-items-center">
                <button class="btn btn-success btn-sm" id="exportBtn"><i class="fas fa-file-excel me-1"></i><span data-i18n="csi.export">导出 Excel</span></button>
                <small class="text-muted" id="summaryBox"></small>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-sm table-bordered table-hover align-middle text-nowrap small">
                <thead class="table-light">
                    <tr>
                        <th style="width:58px;">ID</th>
                        <th style="width:88px;" data-i18n="csi.col_request">申请单号</th>
                        <th style="width:108px;" data-i18n="csi.col_api">接口</th>
                        <th style="width:118px;" data-i18n="csi.col_item">物料号</th>
                        <th style="width:140px;" data-i18n="csi.col_lot">批次</th>
                        <th style="width:76px;" data-i18n="csi.col_qty">数量</th>
                        <th style="width:58px;" data-i18n="csi.col_um">单位(um)</th>
                        <th style="width:64px;" data-i18n="csi.col_warehouse">仓库</th>
                        <th style="width:116px;" data-i18n="csi.col_from_location">源库位</th>
                        <th style="width:96px;" data-i18n="csi.col_to_location">目的库位</th>
                        <th style="width:74px;" data-i18n="csi.col_reasoncode">原因码</th>
                        <th style="width:74px;" data-i18n="csi.col_account">科目</th>
                        <th style="width:258px;" data-i18n="csi.col_trace">traceId</th>
                        <th style="width:86px;" data-i18n="csi.col_sync">同步状态</th>
                        <th style="width:92px;" data-i18n="csi.col_status">状态</th>
                        <th style="width:68px;" data-i18n="csi.col_retry">重试次数</th>
                        <th style="width:210px;" data-i18n="csi.col_error">错误信息</th>
                        <th style="width:136px;" data-i18n="csi.col_submitted">提交时间</th>
                        <th style="width:136px;" data-i18n="csi.col_last_poll">最后轮询</th>
                        <th class="csi-action-col" style="width:76px;" data-i18n="csi.col_action">操作</th>
                    </tr>
                </thead>
                <tbody id="csiBody">
                    <tr><td colspan="20" class="text-center text-muted py-4" data-i18n="csi.loading">加载中...</td></tr>
                </tbody>
            </table>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
            <div class="d-flex align-items-center gap-3 flex-wrap">
                <small class="text-muted" id="pageInfo"></small>
                <div class="d-flex align-items-center gap-1">
                    <small class="text-muted" data-i18n="csi.page_size">每页</small>
                    <select class="form-select form-select-sm" id="pageSizeSel" style="width:auto;"
                            onchange="changePageSize(this.value)">
                        <option value="20">20</option>
                        <option value="50" selected>50</option>
                        <option value="100">100</option>
                        <option value="200">200</option>
                    </select>
                    <small class="text-muted" data-i18n="csi.page_size_unit">条</small>
                </div>
            </div>
            <nav>
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" id="prevLi"><a class="page-link" href="#" onclick="changePage(-1);return false;" data-i18n="csi.prev">上一页</a></li>
                    <li class="page-item disabled"><span class="page-link" id="pageNum">1</span></li>
                    <li class="page-item" id="nextLi"><a class="page-link" href="#" onclick="changePage(1);return false;" data-i18n="csi.next">下一页</a></li>
                </ul>
            </nav>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
var CSI_STATE = { page: 1, size: 50, total: 0 };

function csiEsc(v) {
    if (v === null || v === undefined) return '';
    return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 单元格取值：空值统一显示 '-'，其余转义后输出
function csiVal(v) {
    if (v === null || v === undefined || v === '') return '-';
    return csiEsc(v);
}

// 方向：F=正向 B=反向
function csiDirection(dir) {
    if (dir === 'B') return csiEsc(__('csi.direction_b'));
    if (dir === 'F') return csiEsc(__('csi.direction_f'));
    return '-';
}

function buildCsiQuery(withPaging) {
    var p = new URLSearchParams();
    var site = document.getElementById('fSite').value;
    // admin 选“全部站点”时不传 siteref；普通用户 select 只有当前站
    if (site) p.set('siteref', site);
    if (fSync.value) p.set('is_sync', fSync.value);
    if (fStatus.value) p.set('status', fStatus.value);
    if (fItem.value.trim()) p.set('item', fItem.value.trim());
    if (fLot.value.trim()) p.set('lot', fLot.value.trim());
    if (fDateFrom.value) p.set('date_from', fDateFrom.value);
    if (fDateTo.value) p.set('date_to', fDateTo.value);
    if (fKeyword.value.trim()) p.set('keyword', fKeyword.value.trim());
    if (withPaging) {
        p.set('page', CSI_STATE.page);
        p.set('size', CSI_STATE.size);
    }
    return p.toString();
}

function csiSyncBadge(isSync, label) {
    var cls = isSync === 0 ? 'bg-warning text-dark' : isSync === 1 ? 'bg-success' : isSync === 2 ? 'bg-danger' : 'bg-secondary';
    return '<span class="badge ' + cls + '">' + csiEsc(label) + '</span>';
}

// 状态徽章：REVERSED（已反向）灰色、CANCELLED（已取消）次要色，其余按同步语义着色
function csiStatusBadge(status) {
    if (!status) return '-';
    var cls = {
        PENDING: 'bg-warning text-dark',
        QUEUED: 'bg-info text-dark',
        SUBMITTING: 'bg-primary',
        SUCCESS: 'bg-success',
        REVERSED: 'bg-secondary',
        CANCELLED: 'bg-light text-dark border',
        FAILED_MANUAL: 'bg-danger'
    }[status] || 'bg-secondary';
    var label = status === 'REVERSED' ? __('csi.status_reversed')
        : status === 'CANCELLED' ? __('csi.status_cancelled') : status;
    return '<span class="badge ' + cls + '">' + csiEsc(label) + '</span>';
}

// 失败/终止态才可重发（与后端 csi_interface.py:227 RESEND_FAILED_STATUS 保持一致）
var CSI_RESEND_STATUSES = ['FAILED_MANUAL', 'NOOP', 'CANCELLED', 'FAILED'];
// 未成功过账才可取消（与后端 csi_interface.py:374 CANCEL_ALLOWED_STATUS 保持一致）
var CSI_CANCEL_STATUSES = ['PENDING', 'QUEUED', 'SUBMITTING', 'FAILED_MANUAL', 'NOOP', 'FAILED'];

function csiCanResend(r) {
    if (r.is_sync === 2) return true;
    return CSI_RESEND_STATUSES.indexOf(String(r.status || '').toUpperCase()) >= 0;
}

function csiCanCancel(r) {
    var st = String(r.status || '').toUpperCase();
    if (r.is_sync === 1) return false;
    return CSI_CANCEL_STATUSES.indexOf(st) >= 0;
}

function csiActionCell(r) {
    var btns = '';
    if (csiCanCancel(r)) {
        btns += '<button type="button" class="btn btn-outline-secondary btn-sm px-2 py-0 csi-cancel-btn" data-id="' +
            csiEsc(r.id) + '" title="' + csiEsc(__('csi.cancel')) + '" aria-label="' +
            csiEsc(__('csi.cancel')) + '"><i class="fas fa-ban"></i></button>';
    }
    if (csiCanResend(r)) {
        btns += '<button type="button" class="btn btn-outline-warning btn-sm px-2 py-0 csi-resend-btn" data-id="' +
            csiEsc(r.id) + '" title="' + csiEsc(__('csi.resend')) + '" aria-label="' +
            csiEsc(__('csi.resend')) + '"><i class="fas fa-redo"></i></button>';
    }
    if (!btns) return '<td class="text-center csi-action-col">-</td>';
    return '<td class="text-center csi-action-col"><div class="d-flex gap-1 justify-content-center">' + btns + '</div></td>';
}

// 取消：确认 → 调接口 → 成功刷新列表（失败 toast 后端 message）
function csiCancel(btn) {
    var rowId = btn.getAttribute('data-id');
    if (!rowId) return;
    if (!window.confirm(__('csi.cancel_confirm'))) return;

    var originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>' +
        csiEsc(__('csi.cancelling'));

    apiPost('/api/csi-interface/' + rowId + '/cancel', {}, function (resp) {
        var d = resp.data || {};
        showToast('success', d.message || resp.message || __('csi.cancelled_ok'));
        loadCsi();
    }, function (resp) {
        showToast('error', resp.message || __('csi.cancel_failed'));
        btn.disabled = false;
        btn.innerHTML = originalHtml;
    });
}

// 重发：确认 → loading（单次最长约 30 秒）→ 结果 toast（失败可再次点击重试）
function csiResend(btn) {
    var rowId = btn.getAttribute('data-id');
    if (!rowId) return;
    if (!window.confirm(__('csi.resend_confirm'))) return;

    var cell = btn.parentNode;
    var originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>' +
        csiEsc(__('csi.resending'));
    var hint = document.createElement('div');
    hint.className = 'small text-muted mt-1';
    hint.textContent = __('csi.resending_hint');
    cell.appendChild(hint);

    apiPost('/api/csi-interface/' + rowId + '/resend', {}, function (resp) {
        var d = resp.data || {};
        showToast('success', d.message || __('csi.resend_ok'));
        loadCsi();
    }, function (resp) {
        var d = resp.data || {};
        showToast('error', d.error || resp.message || __('csi.resend_failed'));
        // 失败：恢复按钮，允许再次点击重试
        btn.disabled = false;
        btn.innerHTML = originalHtml;
        if (hint.parentNode) hint.parentNode.removeChild(hint);
    });
}

function loadCsi() {
    var tb = document.getElementById('csiBody');
    tb.innerHTML = '<tr><td colspan="20" class="text-center text-muted py-4">' + csiEsc(__('csi.loading')) + '</td></tr>';
    apiGet('/api/csi-interface?' + buildCsiQuery(true), function (resp) {
        CSI_STATE.total = resp.total || 0;
        var summary = resp.summary || {};
        document.getElementById('summaryBox').innerHTML =
            csiEsc(__('csi.summary')) + ': ' + (summary.total || 0) +
            ' / ' + csiEsc(__('csi.sync_pending')) + ' ' + (summary.pending || 0) +
            ' / ' + csiEsc(__('csi.sync_success')) + ' ' + (summary.success || 0) +
            ' / ' + csiEsc(__('csi.sync_failed')) + ' ' + (summary.failed || 0);
        if (!resp.data || resp.data.length === 0) {
            tb.innerHTML = '<tr><td colspan="20" class="text-center text-muted py-4">' + csiEsc(__('csi.no_data')) + '</td></tr>';
        } else {
            tb.innerHTML = resp.data.map(function (r) {
                var trace = csiEsc(r.traceid);
                var err = csiEsc(r.errormessage);
                var syncCell = (r.is_sync === null || r.is_sync === undefined)
                    ? '-' : csiSyncBadge(r.is_sync, r.is_sync_label);
                return '<tr>' +
                    '<td class="text-muted">' + csiEsc(r.id) + '</td>' +
                    '<td>' + csiVal(r.request_id) + '</td>' +
                    '<td>' + csiVal(r.api_name) + '</td>' +
                    '<td>' + csiVal(r.item) + '</td>' +
                    '<td>' + csiVal(r.lot) + '</td>' +
                    '<td class="text-end">' + csiVal(r.quantity) + '</td>' +
                    '<td>' + csiVal(r.um) + '</td>' +
                    '<td>' + csiVal(r.warehouse) + '</td>' +
                    '<td>' + csiVal(r.from_location) + '</td>' +
                    '<td>' + csiVal(r.to_location) + '</td>' +
                    '<td>' + csiVal(r.reasoncode) + '</td>' +
                    '<td>' + csiVal(r.account) + '</td>' +
                    '<td><span class="d-inline-block text-truncate" style="max-width:180px" title="' + trace + '">' + (trace || '-') + '</span></td>' +
                    '<td>' + syncCell + '</td>' +
                    '<td>' + csiStatusBadge(r.status) + '</td>' +
                    '<td class="text-end">' + csiVal(r.retry_count) + '</td>' +
                    '<td><span class="d-inline-block text-truncate" style="max-width:120px" title="' + err + '">' + (err || '-') + '</span></td>' +
                    '<td>' + csiVal(r.submitted_at) + '</td>' +
                    '<td>' + csiVal(r.last_poll_at) + '</td>' +
                    csiActionCell(r) +
                    '</tr>';
            }).join('');
        }
        renderPager();
    }, function (resp) {
        showToast('error', resp.message || __('csi.load_failed'));
    });
}

function renderPager() {
    var pages = Math.max(1, Math.ceil(CSI_STATE.total / CSI_STATE.size));
    document.getElementById('pageNum').textContent = CSI_STATE.page + ' / ' + pages;
    document.getElementById('pageInfo').textContent =
        __('csi.total_label') + ' ' + CSI_STATE.total + ' ' + __('csi.records');
    document.getElementById('prevLi').classList.toggle('disabled', CSI_STATE.page <= 1);
    document.getElementById('nextLi').classList.toggle('disabled', CSI_STATE.page >= pages);
}

function search() {
    CSI_STATE.page = 1;
    loadCsi();
}

function changePage(delta) {
    var pages = Math.max(1, Math.ceil(CSI_STATE.total / CSI_STATE.size));
    var next = CSI_STATE.page + delta;
    if (next < 1 || next > pages) return;
    CSI_STATE.page = next;
    loadCsi();
}

// 切换每页条数：重置到第 1 页，后端 size 上限 200
function changePageSize(value) {
    var n = parseInt(value, 10);
    if (!n || n < 1) return;
    CSI_STATE.size = Math.min(n, 200);
    CSI_STATE.page = 1;
    loadCsi();
}

function resetFilters() {
    var siteSel = document.getElementById('fSite');
    if (siteSel.options.length && siteSel.querySelector('option[value=""]')) siteSel.value = '';
    fSync.value = '';
    fStatus.value = '';
    fItem.value = '';
    fLot.value = '';
    fDateFrom.value = '';
    fDateTo.value = '';
    fKeyword.value = '';
    search();
}

document.getElementById('exportBtn').addEventListener('click', function () {
    window.location.href = '/api/csi-interface/export?' + buildCsiQuery(false);
});
// 操作列按钮走事件委托（表格行是动态渲染的）
document.getElementById('csiBody').addEventListener('click', function (e) {
    var target = e.target;
    if (!target || !target.closest) return;
    var btn = target.closest('.csi-resend-btn');
    if (btn) { csiResend(btn); return; }
    btn = target.closest('.csi-cancel-btn');
    if (btn) csiCancel(btn);
});
document.addEventListener('DOMContentLoaded', function () {
    loadCsi();
});
</script>
{% endblock %}
