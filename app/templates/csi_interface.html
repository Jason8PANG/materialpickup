{% extends "base.html" %}
{% block title %}同步接口查询 - 物料领取看板{% endblock %}
{% block content %}
<style>
/* 操作列固定右侧：21 列横向滚动时图标按钮始终可见 */
.csi-action-col {
    position: sticky;
    right: 0;
    background: #fff;
    z-index: 2;
    box-shadow: -4px 0 6px -4px rgba(0, 0, 0, .15);
    width: 116px;
    min-width: 116px;
    max-width: 116px;
    white-space: nowrap;
    padding-left: 4px !important;
    padding-right: 4px !important;
}
thead .csi-action-col { z-index: 3; background: #f8f9fa; }
.table-hover > tbody > tr:hover > .csi-action-col { background: #ececec; }
/* 操作按钮纯图标：固定方块尺寸，悬停显示 title */
.csi-action-col .btn {
    width: 32px;
    height: 28px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    padding: 0 !important;
}
/* 重发按钮用实心黄底，避免 outline 在白底上几乎看不见 */
.csi-action-col .csi-resend-btn { color: #212529; border-color: #ffc107; }
.csi-action-col .csi-resend-btn:hover { background: #ffca2c; color: #000; }
/* traceId 完整显示：不截断、不换行，超长靠横向滚动 */
.csi-trace {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    white-space: nowrap;
    word-break: keep-all;
}
/* 操作日志时间线（弹窗内） */
.csi-log-item {
    position: relative;
    margin-left: 6px;
    padding-left: 18px;
    padding-bottom: 14px;
    border-left: 2px solid #e3e6ea;
}
.csi-log-item:last-child { border-left-color: transparent; padding-bottom: 0; }
.csi-log-item::before {
    content: '';
    position: absolute;
    left: -6px;
    top: 3px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #adb5bd;
}
.csi-log-item.csi-log-ok::before { background: #198754; }
.csi-log-item.csi-log-fail::before { background: #dc3545; }
.csi-log-meta { font-size: 12px; color: #6c757d; }
.csi-log-detail {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-all;
    background: #f8f9fa;
    border: 1px solid #e9ecef;
    border-radius: 4px;
    padding: 6px 8px;
    margin: 4px 0 0;
}
</style>
<div class="card shadow-sm">
    <div class="card-header bg-white py-3">
        <h5 class="mb-0"><i class="fas fa-sync-alt me-2 text-info"></i><span data-i18n="csi.title">同步接口查询</span></h5>
    </div>
    <div class="card-body">
        <!-- 筛选区：站点固定为登录站点（不提供切换）；每行控件等宽紧凑，按钮统一收尾 -->
        <div class="row g-2 mb-2">
            <div class="col-6 col-md-2">
                <input type="text" class="form-control form-control-sm" id="fItem" data-i18n="csi.item" placeholder="物料号" title="物料号（模糊）">
            </div>
            <div class="col-6 col-md-2">
                <input type="text" class="form-control form-control-sm" id="fLot" data-i18n="csi.lot" placeholder="批次" title="批次（模糊）">
            </div>
            <div class="col-6 col-md-2">
                <input type="number" min="1" step="1" class="form-control form-control-sm" id="fId" data-i18n="csi.filter_id" placeholder="记录ID" title="记录ID（精确）">
            </div>
            <div class="col-6 col-md-2">
                <input type="text" class="form-control form-control-sm" id="fCoil" data-i18n="csi.filter_coil" placeholder="卷标号，如 261102001" title="卷标号（模糊）">
            </div>
            <div class="col-6 col-md-2">
                <input type="number" min="1" step="1" class="form-control form-control-sm" id="fRequest" data-i18n="csi.filter_request" placeholder="申请单号" title="申请单号（精确）">
            </div>
            <div class="col-6 col-md-2">
                <select class="form-select form-select-sm" id="fApi" title="接口">
                    <option value="" data-i18n="csi.all_api">全部接口</option>
                    <option value="sl-qty-move" data-i18n="csi.api_qty_move">库位转移 sl-qty-move</option>
                    <option value="sl-misc-receipt" data-i18n="csi.api_misc_receipt">盘盈杂项收入 sl-misc-receipt</option>
                    <option value="sl-misc-issue" data-i18n="csi.api_misc_issue">盘亏杂项发出 sl-misc-issue</option>
                    <option value="sl-job-issue" data-i18n="csi.api_job_issue">工单发料 sl-job-issue</option>
                </select>
            </div>
        </div>
        <div class="row g-2 mb-3">
            <div class="col-6 col-md-2">
                <select class="form-select form-select-sm" id="fSync" title="同步状态">
                    <option value="" data-i18n="csi.all_sync">全部同步状态</option>
                    <option value="0" data-i18n="csi.sync_pending">待同步</option>
                    <option value="1" data-i18n="csi.sync_success">成功</option>
                    <option value="2" data-i18n="csi.sync_failed">人工失败</option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <select class="form-select form-select-sm" id="fStatus" title="单据状态">
                    <option value="" data-i18n="csi.all_status">全部状态</option>
                    <option value="PENDING">PENDING</option>
                    <option value="QUEUED">QUEUED</option>
                    <option value="SUBMITTING">SUBMITTING</option>
                    <option value="SUCCESS">SUCCESS</option>
                    <option value="REVERSED" data-i18n="csi.status_reversed">REVERSED</option>
                    <option value="CANCELLED" data-i18n="csi.status_cancelled">CANCELLED</option>
                    <option value="FAILED_MANUAL">FAILED_MANUAL</option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <input type="date" class="form-control form-control-sm" id="fDateFrom" data-i18n="csi.date_from" placeholder="开始日期" title="开始日期">
            </div>
            <div class="col-6 col-md-2">
                <input type="date" class="form-control form-control-sm" id="fDateTo" data-i18n="csi.date_to" placeholder="结束日期" title="结束日期">
            </div>
            <div class="col-12 col-md-4">
                <input type="text" class="form-control form-control-sm" id="fKeyword" data-i18n="csi.keyword" placeholder="traceId / 错误信息 / 创建人" title="traceId / 错误信息 / 创建人（模糊）">
            </div>
        </div>
        <div class="row g-2 mb-3">
            <div class="col-12 d-flex justify-content-end gap-2">
                <button class="btn btn-primary btn-sm px-4" onclick="search()"><i class="fas fa-search me-1"></i><span data-i18n="csi.query">查询</span></button>
                <button class="btn btn-outline-secondary btn-sm px-4" onclick="resetFilters()"><i class="fas fa-redo me-1"></i><span data-i18n="csi.reset">重置</span></button>
            </div>
        </div>
        <div class="row g-2 mb-3">
            <div class="col-12 d-flex justify-content-between align-items-center">
                <button class="btn btn-success btn-sm" id="exportBtn"><i class="fas fa-file-excel me-1"></i><span data-i18n="csi.export">导出 Excel</span></button>
                <small class="text-muted" id="summaryBox"></small>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-sm table-bordered table-hover align-middle text-nowrap small">
                <thead class="table-light">
                    <tr>
                        <th style="width:58px;">ID</th>
                        <th style="width:88px;" data-i18n="csi.col_request">申请单号</th>
                        <th style="width:110px;" data-i18n="csi.col_coil_id">卷标ID</th>
                        <th style="width:108px;" data-i18n="csi.col_api">接口</th>
                        <th style="width:118px;" data-i18n="csi.col_item">物料号</th>
                        <th style="width:140px;" data-i18n="csi.col_lot">批次</th>
                        <th style="width:76px;" data-i18n="csi.col_qty">数量</th>
                        <th style="width:58px;" data-i18n="csi.col_um">单位(um)</th>
                        <th style="width:64px;" data-i18n="csi.col_warehouse">仓库</th>
                        <th style="width:116px;" data-i18n="csi.col_from_location">源库位</th>
                        <th style="width:96px;" data-i18n="csi.col_to_location">目的库位</th>
                        <th style="width:74px;" data-i18n="csi.col_reasoncode">原因码</th>
                        <th style="width:74px;" data-i18n="csi.col_account">科目</th>
                        <th style="width:300px;" data-i18n="csi.col_trace">traceId</th>
                        <th style="width:86px;" data-i18n="csi.col_sync">同步状态</th>
                        <th style="width:92px;" data-i18n="csi.col_status">状态</th>
                        <th style="width:68px;" data-i18n="csi.col_retry">重试次数</th>
                        <th style="width:210px;" data-i18n="csi.col_error">错误信息</th>
                        <th style="width:136px;" data-i18n="csi.col_submitted">提交时间</th>
                        <th style="width:136px;" data-i18n="csi.col_last_poll">最后轮询</th>
                        <th class="csi-action-col" style="width:116px;" data-i18n="csi.col_action">操作</th>
                    </tr>
                </thead>
                <tbody id="csiBody">
                    <tr><td colspan="21" class="text-center text-muted py-4" data-i18n="csi.loading">加载中...</td></tr>
                </tbody>
            </table>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
            <div class="d-flex align-items-center gap-3 flex-wrap">
                <small class="text-muted" id="pageInfo"></small>
                <div class="d-flex align-items-center gap-1">
                    <small class="text-muted" data-i18n="csi.page_size">每页</small>
                    <select class="form-select form-select-sm" id="pageSizeSel" style="width:auto;"
                            onchange="changePageSize(this.value)">
                        <option value="20">20</option>
                        <option value="50" selected>50</option>
                        <option value="100">100</option>
                        <option value="200">200</option>
                    </select>
                    <small class="text-muted" data-i18n="csi.page_size_unit">条</small>
                </div>
            </div>
            <nav>
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" id="prevLi"><a class="page-link" href="#" onclick="changePage(-1);return false;" data-i18n="csi.prev">上一页</a></li>
                    <li class="page-item disabled"><span class="page-link" id="pageNum">1</span></li>
                    <li class="page-item" id="nextLi"><a class="page-link" href="#" onclick="changePage(1);return false;" data-i18n="csi.next">下一页</a></li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<!-- 操作日志时间线弹窗：记录谁在什么时候对这条接口记录做了什么处理 -->
<div class="modal fade" id="csiLogModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header py-2">
                <h6 class="modal-title">
                    <i class="fas fa-history me-2 text-secondary"></i><span data-i18n="csi.log">操作日志</span>
                    <small class="text-muted ms-2" id="csiLogTitle"></small>
                </h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="csiLogBody"></div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
var CSI_STATE = { page: 1, size: 50, total: 0 };
// 当前登录角色：控制操作按钮（重发 admin/me_engineer/warehouse，取消 admin/warehouse）
var CSI_USER_ROLE = '{{ session.user.role }}';
var CSI_CAN_RESEND = ['admin', 'me_engineer', 'warehouse'].indexOf(CSI_USER_ROLE) >= 0;
var CSI_CAN_CANCEL = CSI_USER_ROLE === 'admin' || CSI_USER_ROLE === 'warehouse';

function csiEsc(v) {
    if (v === null || v === undefined) return '';
    return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 单元格取值：空值统一显示 '-'，其余转义后输出
function csiVal(v) {
    if (v === null || v === undefined || v === '') return '-';
    return csiEsc(v);
}

// 申请单号单元格：
//   - 无申请单号（NULL/0）→ '-'
//   - 有权查看 → 链接，新窗口打开原申请单详情页（保留本页筛选上下文）
//   - 无权查看（申请单不存在/无详情页权限/站点不匹配）→ 纯文本 + title 说明原因
function csiRequestCell(r) {
    var rid = r.request_id;
    if (rid === null || rid === undefined || rid === '' || Number(rid) <= 0) return '-';
    var num = csiEsc(rid);
    if (!r.request_openable) {
        var reason = r.request_open_reason;
        var tip;
        if (reason === 'missing') {
            tip = __('csi.request_missing');
        } else if (reason === 'no_permission') {
            tip = __('csi.request_no_permission');
        } else {
            tip = __('csi.request_cross_site').replace('{site}', csiEsc(r.request_siteref || ''));
        }
        return '<span class="text-muted" title="' + csiEsc(tip) + '">' + num + '</span>';
    }
    var url = '/request/' + encodeURIComponent(rid);
    return '<a href="' + url + '" target="_blank" rel="noopener" title="' + url + '">' + num + '</a>';
}

// 方向：F=正向 B=反向
function csiDirection(dir) {
    if (dir === 'B') return csiEsc(__('csi.direction_b'));
    if (dir === 'F') return csiEsc(__('csi.direction_f'));
    return '-';
}

function buildCsiQuery(withPaging) {
    var p = new URLSearchParams();
    // 站点不再由前端传递：后端固定取会话登录站点
    if (fSync.value) p.set('is_sync', fSync.value);
    if (fStatus.value) p.set('status', fStatus.value);
    if (fItem.value.trim()) p.set('item', fItem.value.trim());
    if (fLot.value.trim()) p.set('lot', fLot.value.trim());
    if (fDateFrom.value) p.set('date_from', fDateFrom.value);
    if (fDateTo.value) p.set('date_to', fDateTo.value);
    if (fKeyword.value.trim()) p.set('keyword', fKeyword.value.trim());
    if (fId.value.trim()) p.set('id', fId.value.trim());
    if (fApi.value) p.set('api_name', fApi.value);
    if (fCoil.value.trim()) p.set('coil_id', fCoil.value.trim());
    if (fRequest.value.trim()) p.set('request_id', fRequest.value.trim());
    if (withPaging) {
        p.set('page', CSI_STATE.page);
        p.set('size', CSI_STATE.size);
    }
    return p.toString();
}

function csiSyncBadge(isSync, label) {
    var cls = isSync === 0 ? 'bg-warning text-dark' : isSync === 1 ? 'bg-success' : isSync === 2 ? 'bg-danger' : 'bg-secondary';
    return '<span class="badge ' + cls + '">' + csiEsc(label) + '</span>';
}

// 状态徽章：REVERSED（已反向）灰色、CANCELLED（已取消）次要色，其余按同步语义着色
function csiStatusBadge(status) {
    if (!status) return '-';
    var cls = {
        PENDING: 'bg-warning text-dark',
        QUEUED: 'bg-info text-dark',
        SUBMITTING: 'bg-primary',
        SUCCESS: 'bg-success',
        REVERSED: 'bg-secondary',
        CANCELLED: 'bg-light text-dark border',
        FAILED_MANUAL: 'bg-danger'
    }[status] || 'bg-secondary';
    var label = status === 'REVERSED' ? __('csi.status_reversed')
        : status === 'CANCELLED' ? __('csi.status_cancelled') : status;
    return '<span class="badge ' + cls + '">' + csiEsc(label) + '</span>';
}

// 失败/终止态才可重发；CANCELLED 例外（已取消是业务终态，前端隐藏 + 后端 400 双保险）
var CSI_RESEND_STATUSES = ['FAILED_MANUAL', 'NOOP', 'CANCELLED', 'FAILED'];
// 未成功过账才可取消（与后端 csi_interface.py:374 CANCEL_ALLOWED_STATUS 保持一致）
var CSI_CANCEL_STATUSES = ['PENDING', 'QUEUED', 'SUBMITTING', 'FAILED_MANUAL', 'NOOP', 'FAILED'];

function csiCanResend(r) {
    var st = String(r.status || '').toUpperCase();
    // 已取消的记录不允许重发：取消是业务上的终态，重发会让用户以为还能救回来
    if (st === 'CANCELLED') return false;
    if (r.is_sync === 2) return true;
    return CSI_RESEND_STATUSES.indexOf(st) >= 0;
}

function csiCanCancel(r) {
    var st = String(r.status || '').toUpperCase();
    if (r.is_sync === 1) return false;
    return CSI_CANCEL_STATUSES.indexOf(st) >= 0;
}

function csiActionCell(r) {
    // 操作日志：任何状态都可查（审计入口，不受重发/取消状态限制）
    var btns = '<button type="button" class="btn btn-outline-secondary btn-sm px-2 py-0 csi-log-btn" data-id="' +
        csiEsc(r.id) + '" data-doc="' + csiEsc(r.documentnumber || '') + '" title="' +
        csiEsc(__('csi.log')) + '" aria-label="' + csiEsc(__('csi.log')) +
        '"><i class="fas fa-history fa-fw"></i></button>';
    if (CSI_CAN_CANCEL && csiCanCancel(r)) {
        btns += '<button type="button" class="btn btn-outline-secondary btn-sm px-2 py-0 csi-cancel-btn" data-id="' +
            csiEsc(r.id) + '" title="' + csiEsc(__('csi.cancel')) + '" aria-label="' +
            csiEsc(__('csi.cancel')) + '"><i class="fas fa-ban fa-fw"></i></button>';
    }
    if (CSI_CAN_RESEND && csiCanResend(r)) {
        btns += '<button type="button" class="btn btn-warning btn-sm px-2 py-0 csi-resend-btn" data-id="' +
            csiEsc(r.id) + '" title="' + csiEsc(__('csi.resend')) + '" aria-label="' +
            csiEsc(__('csi.resend')) + '"><i class="fas fa-redo fa-fw"></i></button>';
    }
    return '<td class="text-center csi-action-col"><div class="d-flex gap-1 justify-content-center">' + btns + '</div></td>';
}

// 取消：确认 → 调接口 → 成功刷新列表（失败 toast 后端 message）
function csiCancel(btn) {
    var rowId = btn.getAttribute('data-id');
    if (!rowId) return;
    if (!window.confirm(__('csi.cancel_confirm'))) return;

    var originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>' +
        csiEsc(__('csi.cancelling'));

    apiPost('/api/csi-interface/' + rowId + '/cancel', {}, function (resp) {
        var d = resp.data || {};
        showToast('success', d.message || resp.message || __('csi.cancelled_ok'));
        loadCsi();
    }, function (resp) {
        showToast('error', resp.message || __('csi.cancel_failed'));
        btn.disabled = false;
        btn.innerHTML = originalHtml;
    });
}

// 重发：确认 → 按钮转圈 → 完成后静默刷新列表（状态与轮询时间由后端更新，不弹成功提示）
function csiResend(btn) {
    var rowId = btn.getAttribute('data-id');
    if (!rowId) return;
    if (!window.confirm(__('csi.resend_confirm'))) return;

    var originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

    apiPost('/api/csi-interface/' + rowId + '/resend', {}, function (resp) {
        loadCsi();
    }, function (resp) {
        var d = resp.data || {};
        showToast('error', d.error || resp.message || __('csi.resend_failed'));
        // 失败：恢复按钮，允许再次点击重试
        btn.disabled = false;
        btn.innerHTML = originalHtml;
    });
}

// ===== 操作日志（审计时间线） =====
var CSI_LOG_ACTION_LABELS = {
    resend: '重发',
    cancel: '取消',
    submit: '系统提交',
    success: '过账成功',
    fail: '过账失败',
    count_adjust: '盘点调整',
    count_gain: '盘盈入账'
};

// 后端返回 ISO（2026-10-28T09:00:00），换行显示成 2026-10-28 09:00:00
function csiLogTime(value) {
    if (!value) return '';
    return String(value).replace('T', ' ').replace(/\.[0-9]+.*$/, '');
}

// detail 是 JSON 字符串：能解析就格式化，不能解析就按原文（如错误信息）显示
function csiLogDetailHtml(detail) {
    if (!detail) return '';
    var text = String(detail);
    try { text = JSON.stringify(JSON.parse(text), null, 2); } catch (e) { /* 非 JSON 原文 */ }
    return '<pre class="csi-log-detail">' + csiEsc(text) + '</pre>';
}

function csiLogItemHtml(item) {
    var isFail = String(item.result || 'ok') === 'fail';
    var label = CSI_LOG_ACTION_LABELS[item.action] || item.action || '-';
    var badge = isFail
        ? '<span class="badge bg-danger">' + csiEsc(__('csi.log_fail')) + '</span>'
        : '<span class="badge bg-success">' + csiEsc(__('csi.log_ok')) + '</span>';
    var meta = csiEsc(item.operator || 'SYSTEM');
    if (item.operator_ip) meta += ' · ' + csiEsc(item.operator_ip);
    return '<div class="csi-log-item ' + (isFail ? 'csi-log-fail' : 'csi-log-ok') + '">' +
        '<div class="d-flex justify-content-between align-items-start gap-2">' +
        '<div><span class="fw-semibold">' + csiEsc(label) + '</span> ' + badge +
        ' <span class="csi-log-meta ms-1">' + meta + '</span></div>' +
        '<span class="csi-log-meta text-nowrap">' + csiEsc(csiLogTime(item.created_at)) + '</span>' +
        '</div>' + csiLogDetailHtml(item.detail) + '</div>';
}

// 日志按钮：按 target_id + target_type 拉该记录的全部操作，渲染成时间线
function csiShowLog(btn) {
    var rowId = btn.getAttribute('data-id');
    if (!rowId) return;
    var doc = btn.getAttribute('data-doc') || '';
    document.getElementById('csiLogTitle').textContent = '#' + rowId + (doc ? ' · ' + doc : '');
    var body = document.getElementById('csiLogBody');
    body.innerHTML = '<div class="text-center text-muted py-4">' +
        '<span class="spinner-border spinner-border-sm me-2"></span>' + csiEsc(__('csi.loading')) + '</div>';
    new bootstrap.Modal(document.getElementById('csiLogModal')).show();
    apiGet('/api/operation-log?target_type=csi_interface&target_id=' + encodeURIComponent(rowId) + '&size=100',
        function (resp) {
            var rows = resp.data || [];
            body.innerHTML = rows.length
                ? rows.map(csiLogItemHtml).join('')
                : '<div class="text-center text-muted py-4">' + csiEsc(__('csi.log_empty')) + '</div>';
        },
        function (resp) {
            body.innerHTML = '<div class="text-center text-danger py-4">' +
                csiEsc(resp.message || __('csi.log_failed')) + '</div>';
        });
}

function loadCsi() {    var tb = document.getElementById('csiBody');
    tb.innerHTML = '<tr><td colspan="21" class="text-center text-muted py-4">' + csiEsc(__('csi.loading')) + '</td></tr>';
    apiGet('/api/csi-interface?' + buildCsiQuery(true), function (resp) {
        CSI_STATE.total = resp.total || 0;
        var summary = resp.summary || {};
        document.getElementById('summaryBox').innerHTML =
            csiEsc(__('csi.summary')) + ': ' + (summary.total || 0) +
            ' / ' + csiEsc(__('csi.sync_pending')) + ' ' + (summary.pending || 0) +
            ' / ' + csiEsc(__('csi.sync_success')) + ' ' + (summary.success || 0) +
            ' / ' + csiEsc(__('csi.sync_failed')) + ' ' + (summary.failed || 0);
        if (!resp.data || resp.data.length === 0) {
            tb.innerHTML = '<tr><td colspan="21" class="text-center text-muted py-4">' + csiEsc(__('csi.no_data')) + '</td></tr>';
        } else {
            tb.innerHTML = resp.data.map(function (r) {
                var trace = csiEsc(r.traceid);
                var err = csiEsc(r.errormessage);
                var syncCell = (r.is_sync === null || r.is_sync === undefined)
                    ? '-' : csiSyncBadge(r.is_sync, r.is_sync_label);
                return '<tr>' +
                    '<td class="text-muted">' + csiEsc(r.id) + '</td>' +
                    '<td>' + csiRequestCell(r) + '</td>' +
                    '<td>' + csiVal(r.coil_id) + '</td>' +
                    '<td>' + csiVal(r.api_name) + '</td>' +
                    '<td>' + csiVal(r.item) + '</td>' +
                    '<td>' + csiVal(r.lot) + '</td>' +
                    '<td class="text-end">' + csiVal(r.quantity) + '</td>' +
                    '<td>' + csiVal(r.um) + '</td>' +
                    '<td>' + csiVal(r.warehouse) + '</td>' +
                    '<td>' + csiVal(r.from_location) + '</td>' +
                    '<td>' + csiVal(r.to_location) + '</td>' +
                    '<td>' + csiVal(r.reasoncode) + '</td>' +
                    '<td>' + csiVal(r.account) + '</td>' +
                    '<td class="csi-trace">' + (trace || '-') + '</td>' +
                    '<td>' + syncCell + '</td>' +
                    '<td>' + csiStatusBadge(r.status) + '</td>' +
                    '<td class="text-end">' + csiVal(r.retry_count) + '</td>' +
                    '<td><span class="d-inline-block text-truncate" style="max-width:200px" title="' + err + '">' + (err || '-') + '</span></td>' +
                    '<td>' + csiVal(r.submitted_at) + '</td>' +
                    '<td>' + csiVal(r.last_poll_at) + '</td>' +
                    csiActionCell(r) +
                    '</tr>';
            }).join('');
        }
        renderPager();
    }, function (resp) {
        showToast('error', resp.message || __('csi.load_failed'));
    });
}

function renderPager() {
    var pages = Math.max(1, Math.ceil(CSI_STATE.total / CSI_STATE.size));
    document.getElementById('pageNum').textContent = CSI_STATE.page + ' / ' + pages;
    document.getElementById('pageInfo').textContent =
        __('csi.total_label') + ' ' + CSI_STATE.total + ' ' + __('csi.records');
    document.getElementById('prevLi').classList.toggle('disabled', CSI_STATE.page <= 1);
    document.getElementById('nextLi').classList.toggle('disabled', CSI_STATE.page >= pages);
}

function search() {
    CSI_STATE.page = 1;
    loadCsi();
}

function changePage(delta) {
    var pages = Math.max(1, Math.ceil(CSI_STATE.total / CSI_STATE.size));
    var next = CSI_STATE.page + delta;
    if (next < 1 || next > pages) return;
    CSI_STATE.page = next;
    loadCsi();
}

// 切换每页条数：重置到第 1 页，后端 size 上限 200
function changePageSize(value) {
    var n = parseInt(value, 10);
    if (!n || n < 1) return;
    CSI_STATE.size = Math.min(n, 200);
    CSI_STATE.page = 1;
    loadCsi();
}

function resetFilters() {
    fSync.value = '';
    fStatus.value = '';
    fItem.value = '';
    fLot.value = '';
    fDateFrom.value = '';
    fDateTo.value = '';
    fKeyword.value = '';
    fId.value = '';
    fApi.value = '';
    fCoil.value = '';
    fRequest.value = '';
    search();
}

document.getElementById('exportBtn').addEventListener('click', function () {
    window.location.href = '/api/csi-interface/export?' + buildCsiQuery(false);
});
// 操作列按钮走事件委托（表格行是动态渲染的）
document.getElementById('csiBody').addEventListener('click', function (e) {
    var target = e.target;
    if (!target || !target.closest) return;
    var btn = target.closest('.csi-resend-btn');
    if (btn) { csiResend(btn); return; }
    btn = target.closest('.csi-log-btn');
    if (btn) { csiShowLog(btn); return; }
    btn = target.closest('.csi-cancel-btn');
    if (btn) csiCancel(btn);
});
// 所有筛选控件回车即查询（含 ID / 接口 / 卷标ID）
['fSync', 'fStatus', 'fItem', 'fLot', 'fDateFrom', 'fDateTo',
 'fKeyword', 'fId', 'fApi', 'fCoil', 'fRequest'].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); search(); }
    });
});
document.addEventListener('DOMContentLoaded', function () {
    loadCsi();
});
</script>
{% endblock %}
